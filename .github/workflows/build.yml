name: Build
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  check:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Build
        run: pnpm build
